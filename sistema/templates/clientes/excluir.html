{% extends 'base.html' %}

{% block content %}

<div class="card">
    <div class="card-body">

        <h3>Excluir cliente</h3>

        <p>
            Tem certeza que deseja excluir o cliente
            <strong>{{ cliente.nome }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Sim, excluir
            </button>

            <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </form>

    </div>
</div>

{% endblock %}
