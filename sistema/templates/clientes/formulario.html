{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">{{ titulo }}</h1>

<form method="post">
    {% csrf_token %}

    {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}

            {% if field.errors %}
                {% for erro in field.errors %}
                    <div class="text-danger">{{ erro }}</div>
                {% endfor %}
            {% endif %}
        </div>
    {% endfor %}

    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
</form>

<script>
const cpf = document.getElementById('id_cpf');

cpf.addEventListener('input', function() {
    let valor = this.value.replace(/\D/g, '');

    valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
    valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
    valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');

    this.value = valor.substring(0, 14);
});


const telefone = document.getElementById('id_telefone');

telefone.addEventListener('input', function() {
    let valor = this.value.replace(/\D/g, '');

    if (valor.length <= 10) {
        valor = valor.replace(/(\d{2})(\d)/, '($1) $2');
        valor = valor.replace(/(\d{4})(\d)/, '$1-$2');
    } else {
        valor = valor.replace(/(\d{2})(\d)/, '($1) $2');
        valor = valor.replace(/(\d{5})(\d)/, '$1-$2');
    }

    this.value = valor.substring(0, 15);
});
</script>

{% endblock %}
