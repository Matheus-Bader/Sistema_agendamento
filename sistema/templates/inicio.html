{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">Dashboard</h1>

<p>Olá, {{ user.username }}!</p>

<div class="row">

    <div class="col-md-3 mb-3">
        <div class="card">
            <div class="card-body">
                <h5>Clientes</h5>
                <h2>{{ clientes }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card">
            <div class="card-body">
                <h5>Serviços ativos</h5>
                <h2>{{ servicos }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card">
            <div class="card-body">
                <h5>Agendamentos hoje</h5>
                <h2>{{ agendamentos_hoje }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card">
            <div class="card-body">
                <h5>Realizados</h5>
                <h2>{{ agendamentos_realizados }}</h2>
            </div>
        </div>
    </div>

</div>

<div class="mt-4">

    <a href="{% url 'lista_clientes' %}" class="btn btn-primary">Clientes</a>

    <a href="{% url 'lista_servicos' %}" class="btn btn-success">Serviços</a>

    <a href="{% url 'lista_agendamentos' %}" class="btn btn-warning">Agendamentos</a>

</div>

{% endblock %}
