{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h3>Excluir agendamento</h3>

        <p>
            Tem certeza que deseja excluir este agendamento?
        </p>

        <form method="post">

            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Sim, excluir
            </button>

            <a href="{% url 'lista_agendamentos' %}" class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>

</div>

{% endblock %}
